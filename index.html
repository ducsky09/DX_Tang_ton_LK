<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Form Đề Xuất Tăng Tồn LK Bóc Tách</title>
<style>
:root{--red:#d71920;--ink:#1e2433;--mut:#6b7385;--bg:#f2f4f9;--card:#fff;--bd:#dde2ee}
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
aside{width:310px;background:linear-gradient(180deg,#1b2033,#0f1322);color:#e8ebf5;padding:20px 18px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{font-weight:800;font-size:22px;color:#fff}.brand b{color:#ff4b52}.sub{font-size:12px;color:#9aa3bd;margin:2px 0 14px}
aside h4{margin:16px 0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9aa3bd}
aside label{display:block;font-size:12px;margin:8px 0 3px;color:#c5cbe0}
aside input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid #38405c;background:#171c30;color:#fff;font-size:13px}
aside input.bad{border-color:#ff6b6b}aside input.ok{border-color:#3ecf8e}
.err{color:#ff8a8a;font-size:11px;min-height:13px}
.nav button{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border:0;border-radius:10px;background:#1c223a;color:#dfe3f2;font-size:14px;cursor:pointer}
.nav button.act{background:var(--red);color:#fff;font-weight:600}.nav button:disabled{opacity:.4;cursor:not-allowed}
.btn{padding:9px 18px;border:0;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;background:var(--red);color:#fff}
.btn.g{background:#2b8a5a}.btn.b{background:#2f5bd8}.btn.w{background:#e9ecf5;color:var(--ink)}.btn.full{width:100%;margin-top:12px}
main{flex:1;padding:24px;min-width:0}
.card{background:var(--card);border-radius:14px;box-shadow:0 2px 10px rgba(20,30,60,.07);padding:22px;margin-bottom:18px}
h2{margin:0 0 4px}.clock{color:var(--red);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.grid label{font-size:12px;font-weight:600;color:var(--mut);display:block;margin-bottom:4px}
.grid input,.grid textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit}
.grid input.bad{border-color:#e5484d;background:#fff6f6}.grid .err{color:#e5484d}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
table.l{width:100%;border-collapse:collapse;font-size:13px}table.l th,table.l td{border-bottom:1px solid var(--bd);padding:7px;text-align:left}
.tbl{overflow:auto}.pane{display:none}.pane.act{display:block}
.sheetwrap{overflow:auto;background:#fff;padding:14px;border-radius:12px;box-shadow:0 2px 10px rgba(20,30,60,.07)}
.toast{position:fixed;right:20px;bottom:20px;background:#1b2033;color:#fff;padding:12px 18px;border-radius:10px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(10,14,28,.6);display:none;align-items:center;justify-content:center;z-index:10}
#modal div{background:#fff;border-radius:14px;padding:24px;max-width:460px}
/* ===== Biểu mẫu ===== */
.form{font-family:"Times New Roman",serif;font-size:14px;color:#000;background:#fff;width:1120px;margin:auto}
.form table{border-collapse:collapse}.form .tb{width:100%}.form .tb td,.form .tb th{border:1px solid #000;padding:4px 5px;text-align:center;height:46px}
.form .tb th{height:40px}.form .tb td.l{text-align:left}
.logo{color:#e30613;font:italic 900 40px Arial,sans-serif}.logo2{background:#e30613;color:#fff;font:italic 900 32px Arial,sans-serif;padding:10px 24px;display:inline-block}
.sig{display:flex;justify-content:space-between;margin:24px 40px;text-align:center;font-style:italic}

@media print{body{display:block;background:#fff}aside,.noprint,.toast,.card,.bar{display:none!important}main{padding:0}
.pane{display:none!important}.pane.printing{display:block!important}.sheetwrap{box-shadow:none;padding:0;overflow:visible}}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;height:auto;position:static}}
</style></head><body>
<aside>
 <div class="brand">Media<b>Mart</b></div><div class="sub">Đề xuất tăng tồn LK bóc tách</div>
 <h4>Thông tin kê khai (bắt buộc)</h4>
 <label>Họ Tên (≥10 ký tự)</label><input id="p_name"><div class="err" id="e_p_name"></div>
 <label>Mã nhân viên (10 ký tự, bắt đầu MM)</label><input id="p_id" maxlength="10"><div class="err" id="e_p_id"></div>
 <label>HUB (4 ký tự, bắt đầu S hoặc L)</label><input id="p_hub" maxlength="4"><div class="err" id="e_p_hub"></div>
 <label>Code kho (4 ký tự, bắt đầu M hoặc L)</label><input id="p_kho" maxlength="4"><div class="err" id="e_p_kho"></div>
 <label>Địa chỉ (≥10 ký tự)</label><input id="p_addr"><div class="err" id="e_p_addr"></div>
 <button class="btn full" id="saveProfile">💾 Lưu thông tin</button>
 <h4>Chức năng</h4>
 <div class="nav"><button data-t="dx" class="act">📝 ĐX Tăng Tồn</button><button data-t="bb">📄 Biên bản bàn giao</button><button data-t="dh">🧾 Đơn đặt hàng</button></div>
 <h4>Kết nối Google Sheet</h4>
 <label>URL Apps Script (Web App)</label><input id="gs_url" placeholder="https://script.google.com/macros/s/.../exec">
 <button class="btn w full" id="saveUrl">Lưu kết nối</button>
 <button class="btn b full" id="pull">⟳ Đồng bộ từ sheet ĐX BT</button>
</aside>
<main>
<section class="pane act" id="t_dx">
 <div class="card"><h2>Đề xuất tăng tồn LK bóc tách</h2><div>Ngày đề xuất: <span class="clock" id="clock"></span></div></div>
 <div class="card"><div class="grid">
  <div><label>Số PBH nội bộ bóc tách *</label><input id="f_pbh" maxlength="9" placeholder="PBH123456"><div class="err" id="e_f_pbh"></div></div>
  <div><label>Mã SP * (6 số, bắt đầu 7)</label><input id="f_msp" maxlength="6"><div class="err" id="e_f_msp"></div></div>
  <div><label>Tên SP * (≥10 ký tự)</label><input id="f_tsp"><div class="err" id="e_f_tsp"></div></div>
  <div><label>Serial No. * (≥10 ký tự)</label><input id="f_sn"><div class="err" id="e_f_sn"></div></div>
  <div><label>Mã LK * (6 số, bắt đầu 7)</label><input id="f_mlk" maxlength="6"><div class="err" id="e_f_mlk"></div></div>
  <div><label>Tên LK * (≥10 ký tự)</label><input id="f_tlk"><div class="err" id="e_f_tlk"></div></div>
  <div><label>Số lượng</label><input id="f_sl" type="number" min="1" value="1"><div class="err" id="e_f_sl"></div></div>
  <div><label>Tình trạng LK</label><input id="f_tt" value="LK Tốt Bóc Tách"></div>
  <div><label>Số PBH khách</label><input id="f_khach"></div>
  <div><label>Ghi chú</label><input id="f_gc" value="Biên bản bàn giao hàng hóa"></div>
 </div>
 <div class="bar"><button class="btn" id="add">➕ Thêm vào danh sách</button><button class="btn g" id="send">📤 Send Admin</button><button class="btn w" id="xls">💾 Lưu Excel</button></div></div>
 <div class="card tbl"><b>Danh sách đề xuất</b><table class="l" id="list"></table></div>
</section>
<section class="pane" id="t_bb"><div class="sheetwrap"><div class="form" id="bbForm"></div></div>
 <div class="bar"><button class="btn b" onclick="doPrint('t_bb','bbForm')">🖨 IN</button></div></section>
<section class="pane" id="t_dh"><div class="sheetwrap"><div class="form" id="dhForm" style="width:780px"></div></div>
 <div class="bar"><button class="btn b" onclick="doPrint('t_dh','dhForm')">🖨 IN</button></div></section>
</main>
<div class="toast" id="toast"></div>
<div id="modal"><div><h3>Đã in xong</h3><p>Vui lòng gửi bản ảnh biên bản cho admin.</p><button class="btn" onclick="modal.style.display='none'">Đã hiểu</button></div></div>

const SH='ĐX BT';
function doPost(e){const s=SpreadsheetApp.getActive().getSheetByName(SH),d=JSON.parse(e.postData.contents);
 d.rows.forEach(r=>s.appendRow([r.ngay,r.pbh,r.msp,r.tsp,r.sn,r.mlk,r.tlk,r.sl,r.tt,r.khach,r.gc,r.name,r.id,r.hub,r.kho,r.addr]));
 return ContentService.createTextOutput('ok');}
function doGet(){const v=SpreadsheetApp.getActive().getSheetByName(SH).getDataRange().getValues().slice(1);
 return ContentService.createTextOutput(JSON.stringify(v)).setMimeType(ContentService.MimeType.JSON);}
